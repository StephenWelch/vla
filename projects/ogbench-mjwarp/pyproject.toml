[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogbench-mjwarp"
version = "0.1.0"
description = "GPU-parallel OGBench planning and LeRobot demonstrations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "vla-tools",
  "ogbench @ git+https://github.com/seohongpark/ogbench.git@1d4140997f60c52c6fb0702ec100dc988b18c548",
  "mujoco-warp==3.14.0",
  "mujoco==3.14.0",
  "warp-lang==1.17.0",
  "dm-control==1.0.47",
  "gymnasium==1.3.0",
  "torch==2.11.0",
  "numpy>=2,<2.3",
  "tyro>=1.0,<2",
  "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
dataset = ["lerobot[dataset]==0.6.1"]
evaluation = ["lerobot[evaluation,smolvla,training]==0.6.1"]
tracking = ["wandb>=0.27,<0.28"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
ogbench-mjwarp = "ogbench_mjwarp.cli:main"
vla-ogbench-train = "ogbench_mjwarp.train:main"
vla-ogbench-pipeline = "ogbench_mjwarp.pipeline:main"
vla-ogbench-prepare = "ogbench_mjwarp.prepare:main"
vla-ogbench-eval = "ogbench_mjwarp.evaluate:main"

[tool.uv.sources]
vla-tools = { path = "../../packages/vla-tools", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ogbench_mjwarp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires NVIDIA GPU", "dataset: requires LeRobot"]
