dataset: ${oc.env:OGBENCH_DATA_ROOT,outputs/ogbench}/datasets/cube-training-v2
policy: ${oc.env:VLA_MODEL_ROOT,outputs/models}/smolvla_base
policy_type: smolvla
output: ${oc.env:OGBENCH_DATA_ROOT,outputs/ogbench}/runs/smolvla-wandb-v2
hf_home: ${oc.env:VLA_MODEL_ROOT,outputs/models}/hf-cache
camera_keys:
  - observation.images.front
  - observation.images.wrist
camera_names:
  - observation.images.camera1
  - observation.images.camera2
steps: 20000
batch_size: 8
workers: 2
seed: 1000
validation_fraction: 0.2
loss_eval_freq: 1000
rollout_eval_freq: 2000
probe_frames: 1024
eval_episodes: 10
eval_max_steps: 250
overrides:
  - policy.chunk_size=16
  - policy.n_action_steps=16
  - log_freq=25

wandb:
  enable: true
  project: vla-ogbench
  mode: online
