[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocbench-mjwarp"
version = "0.1.0"
description = "Native OCBench demonstrations, LeRobot export and policy evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "vla-tools",
  "ocbench @ git+https://github.com/seohongpark/ocbench.git@e2cd2f72110b66bd65afab1b855d81ebc73aeacc",
  "mujoco-warp==3.14.0", "mujoco==3.14.0", "warp-lang==1.17.0",
  "dm-control==1.0.47", "gymnasium==1.3.0", "torch==2.11.0",
  "numpy>=2,<2.3", "tyro>=1,<2", "omegaconf>=2.3,<3",
  "lerobot[evaluation,training]==0.6.1", "wandb>=0.27,<0.28",
]

[project.scripts]
ocbench-mjwarp = "ocbench_mjwarp.cli:main"
vla-ocbench-pipeline = "ocbench_mjwarp.pipeline:main"
vla-ocbench-train = "ocbench_mjwarp.train:main"
vla-ocbench-eval = "ocbench_mjwarp.evaluate:main"

[tool.uv.sources]
vla-tools = { path = "../../packages/vla-tools", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires NVIDIA GPU", "dataset: requires LeRobot"]
